# .github/workflows/build-amd64.yml
name: Build QEMU for amd64 (x86_64) platforms

on:
  workflow_dispatch:          # 手动触发
  push:
    branches: [ master ]
  pull_request:

env:
  QEMU_SOURCE_REPO: 'Geeeeeker/QEMUAppleSilicon'
  TARGET_LIST: 'aarch64-softmmu,arm-softmmu,x86_64-softmmu'

jobs:
  # Linux x86_64
  build-linux-amd64:
    name: Linux x86_64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.QEMU_SOURCE_REPO }}
          fetch-depth: 0
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential libtool meson ninja-build pkg-config libcapstone-dev \
            device-tree-compiler libglib2.0-dev gnutls-bin libjpeg-turbo8-dev \
            libpng-dev libslirp-dev libssh-dev libusb-1.0-0-dev liblzo2-dev \
            libncurses5-dev libpixman-1-dev libsnappy-dev vde2 zstd libgnutls28-dev \
            libgmp10 libgmp3-dev lzfse liblzfse-dev
      - name: Build nettle
        run: |
          wget https://ftp.gnu.org/gnu/nettle/nettle-3.10.1.tar.gz
          tar -xvf nettle-3.10.1.tar.gz
          cd nettle-3.10.1
          ./configure
          make -j$(nproc)
          sudo make install
      - name: Configure and build
        run: |
          mkdir build && cd build
          PKG_CONFIG_PATH=/usr/local/lib64/pkgconfig \
          ../configure --target-list=${{ env.TARGET_LIST }} \
            --enable-capstone --enable-slirp --enable-lzfse --enable-nettle --enable-gnutls \
            --disable-werror
          make -j$(nproc)
      - name: Install to temp and package
        run: |
          cd build
          make DESTDIR=${{ runner.temp }}/qemu-install install
          cd ${{ runner.temp }}/qemu-install
          zip -r ${{ github.workspace }}/qemu-linux-amd64.zip .
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: qemu-linux-amd64
          path: qemu-linux-amd64.zip

  # macOS x86_64
  build-macos-amd64:
    name: macOS x86_64
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.QEMU_SOURCE_REPO }}
          fetch-depth: 0
      - name: Install dependencies
        run: |
          brew install libtool meson ninja pkgconf capstone dtc glib gnutls \
            jpeg-turbo libpng libslirp libssh libusb lzo ncurses nettle pixman \
            snappy vde zstd lzfse
      - name: Configure and build
        run: |
          mkdir build && cd build
          LIBTOOL="glibtool" ../configure \
            --target-list=${{ env.TARGET_LIST }} \
            --disable-bsd-user --disable-guest-agent \
            --enable-lzfse --enable-slirp --enable-capstone --enable-curses \
            --enable-libssh --enable-virtfs --enable-zstd \
            --disable-sdl --disable-gtk --enable-cocoa \
            --extra-cflags="-DNCURSES_WIDECHAR=1" \
            --disable-werror
          make -j$(sysctl -n hw.logicalcpu)
      - name: Install and package
        run: |
          cd build
          make DESTDIR=${{ runner.temp }}/qemu-install install
          cd ${{ runner.temp }}/qemu-install
          zip -r ${{ github.workspace }}/qemu-macos-amd64.zip .
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: qemu-macos-amd64
          path: qemu-macos-amd64.zip

  # Windows x86_64 (MSYS2)
  build-windows-amd64:
    name: Windows x86_64
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.QEMU_SOURCE_REPO }}
          fetch-depth: 0
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-libtool
            mingw-w64-x86_64-meson
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-pkg-config
            mingw-w64-x86_64-capstone
            mingw-w64-x86_64-glib2
            mingw-w64-x86_64-gnutls
            mingw-w64-x86_64-libjpeg-turbo
            mingw-w64-x86_64-libpng
            mingw-w64-x86_64-libslirp
            mingw-w64-x86_64-libssh
            mingw-w64-x86_64-libusb
            mingw-w64-x86_64-lzo2
            mingw-w64-x86_64-ncurses
            mingw-w64-x86_64-pixman
            mingw-w64-x86_64-snappy
            mingw-w64-x86_64-zstd
            mingw-w64-x86_64-lzfse
            make
      - name: Configure and build
        run: |
          mkdir build && cd build
          ../configure --target-list=${{ env.TARGET_LIST }} \
            --enable-capstone --enable-slirp --enable-lzfse --enable-gnutls \
            --disable-werror
          make -j$(nproc)
      - name: Install and package
        run: |
          cd build
          make DESTDIR="$RUNNER_TEMP/qemu-install" install
          cd "$RUNNER_TEMP/qemu-install"
          zip -r "$GITHUB_WORKSPACE/qemu-windows-amd64.zip" .
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: qemu-windows-amd64
          path: qemu-windows-amd64.zip

  # 上传到 Release (手动指定 tag)
  upload-to-release:
    name: Upload amd64 artifacts to Release
    needs: [build-linux-amd64, build-macos-amd64, build-windows-amd64]
    if: github.event_name == 'workflow_dispatch' && github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts
      - name: Create Release and upload assets
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: ./artifacts/**/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
